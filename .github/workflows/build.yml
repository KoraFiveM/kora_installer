name: Kora installer
on:
  push:
    branches: ['**']
    tags: ['kora-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test -z "$(gofmt -l *.go)"
      - name: Embed Windows GUI manifest
        if: runner.os == 'Windows'
        run: go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -manifest assets/control.manifest -o control_windows_amd64.syso
      - run: go test -race ./...
      - name: Test native Kora Control widgets and shared backend
        if: runner.os == 'Windows'
        env:
          KORA_GUI_SCREENSHOT: ${{ runner.temp }}/kora-control.png
        # Win32 MAKEINTRESOURCE uses integer pseudo-pointers. Limit the exception
        # to the upstream Win32 toolkit; Kora code keeps checkptr and race checks.
        run: go test -race -gcflags="github.com/lxn/...=-d=checkptr=0" -tags gui -timeout 3m ./...
      - name: Check GUI code
        if: runner.os == 'Windows'
        run: go vet -tags gui ./...
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: kora-control-preview
          path: ${{ runner.temp }}/kora-control.png
          if-no-files-found: warn
      - run: go vet ./...
      - run: python -m unittest discover -s assets -p 'test_*.py' -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and package Linux CLI and Windows applications in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          target: artifacts
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: kora-release
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/kora-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kora-release
          path: artifacts
      - name: Publish verified native CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts/linux-amd64 && sha256sum --check kora-linux-amd64.sha256 && sha256sum --check SHA256SUMS)
          (cd artifacts/windows-amd64 && sha256sum --check kora_installer.exe.sha256 && sha256sum --check kora-control.exe.sha256 && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Kora Control Windows GUI, native Windows CLI and Linux Docker-server CLI, built in Docker. Checksums included. Windows runtime does not require Docker, WSL or Python." artifacts/linux-amd64/kora-linux-amd64 artifacts/linux-amd64/kora-linux-amd64.sha256 artifacts/linux-amd64/kora_installer-linux-amd64.zip artifacts/windows-amd64/kora_installer.exe artifacts/windows-amd64/kora_installer.exe.sha256 artifacts/windows-amd64/kora_installer-windows-amd64.zip artifacts/windows-amd64/kora-control.exe artifacts/windows-amd64/kora-control.exe.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
