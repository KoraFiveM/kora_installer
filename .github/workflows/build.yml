name: Kora installer
on:
  push:
    branches: ['**']
    tags: ['kora-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Offline Go tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Offline launcher tests
        run: python -m unittest discover -s assets -p 'test_*.py' -v
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o dist/kora .
      - name: Package with checksum
        env:
          INSTALLER_BINARY: kora
          INSTALLER_TARGET: linux-amd64
        run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: kora_installer-linux-amd64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/kora-linux-amd64*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/kora-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish verified CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts/kora_installer-linux-amd64
          sha256sum --check kora-linux-amd64.sha256
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Kora CLI for Linux x86-64, including WSL 2. Run inside your Linux distribution with Docker Desktop WSL integration enabled. Checksums are included." kora-linux-amd64 kora-linux-amd64.sha256 kora_installer-linux-amd64.zip SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
